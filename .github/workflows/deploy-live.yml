# Pubblica il sito su Keliweb quando il ramo "live" viene aggiornato.
# ultrapixel.it e ultrapixel.fr vengono costruiti nella versione di lancio (indicizzabile) e caricati via FTPS.
# Non vengono mai caricati: sorgenti, backend dei moduli (config del server), .htaccess del server.
# Il caricamento sovrascrive solo i file del sito; file presenti solo sul server (vecchio sito, backend, posta) restano.
#
# Secrets (Settings > Secrets and variables > Actions):
#   ultrapixel.it: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR_IT (cartella con "/" finale, "./" = radice dell'account FTP)
#   ultrapixel.fr (hosting separato): FR_FTP_SERVER, FR_FTP_USERNAME, FR_FTP_PASSWORD, FTP_DIR_FR
#   Se i secret di un sito mancano, quel sito viene saltato.
# Dopo ogni pubblicazione gli URL della sitemap vengono segnalati a Bing/Yandex/Seznam via IndexNow
# (chiave pubblica nel file <chiave>.txt alla radice del sito).
name: Pubblica ultrapixel.it e ultrapixel.fr

on:
  push:
    branches: [live]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - site: it
            url: https://ultrapixel.it
            build_args: --launch
            dir_secret: FTP_DIR_IT
            prefix: ""
            extra_exclude: "__nessuno__/**"
          - site: fr
            url: https://ultrapixel.fr
            build_args: --launch --home=fr
            dir_secret: FTP_DIR_FR
            prefix: "FR_"
            extra_exclude: "fr/**"
    env:
      HOST: ${{ secrets[format('{0}FTP_SERVER', matrix.prefix)] }}
      USER: ${{ secrets[format('{0}FTP_USERNAME', matrix.prefix)] }}
      PASS: ${{ secrets[format('{0}FTP_PASSWORD', matrix.prefix)] }}
      DIR: ${{ secrets[matrix.dir_secret] }}
    steps:
      - name: Credenziali presenti? (${{ matrix.site }})
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then echo "Secret FTP mancanti per ${{ matrix.site }}: sito saltato."; fi

      - uses: actions/checkout@v4
        if: env.HOST != '' && env.USER != '' && env.PASS != ''

      - uses: actions/setup-python@v5
        if: env.HOST != '' && env.USER != '' && env.PASS != ''
        with:
          python-version: "3.12"

      - name: Costruisci la versione di lancio (${{ matrix.site }})
        if: env.HOST != '' && env.USER != '' && env.PASS != ''
        run: |
          python build.py ${{ matrix.build_args }}
          # su ultrapixel.fr il francese sta alla radice: la cartella /fr/ della versione .it non serve
          if [ "${{ matrix.site }}" = fr ]; then rm -rf fr; fi
          if grep -q 'name="robots" content="noindex' index.html; then echo "La homepage è in noindex: stop."; exit 1; fi
          if grep -rlq 'onrender.com' --include='*.html' --exclude-dir=src --exclude-dir=content --exclude-dir=backend --exclude-dir=server . ; then echo "Trovati link all'anteprima Render: stop."; exit 1; fi

      - name: Carica su Keliweb (${{ matrix.site }})
        if: env.HOST != '' && env.USER != '' && env.PASS != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.HOST }}
          username: ${{ env.USER }}
          password: ${{ env.PASS }}
          protocol: ftps
          server-dir: ${{ env.DIR != '' && env.DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/__pycache__/**
            README.md
            build.py
            .htaccess
            src/**
            content/**
            backend/**
            server/**
            ${{ matrix.extra_exclude }}

      - name: Controlla che il sito risponda (${{ matrix.site }})
        if: env.HOST != '' && env.USER != '' && env.PASS != ''
        run: |
          for p in / /blog/ /sitemap.xml /llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ matrix.url }}$p")
            echo "$p -> $code"; [ "$code" = 200 ] || exit 1
          done

      - name: Avvisa Bing e gli altri motori via IndexNow (${{ matrix.site }})
        if: env.HOST != '' && env.USER != '' && env.PASS != ''
        continue-on-error: true
        env:
          SITE_URL: ${{ matrix.url }}
          INDEXNOW_KEY: 606665fff1f5df89fdb16273f5896eaa
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          site = os.environ["SITE_URL"].rstrip("/"); key = os.environ["INDEXNOW_KEY"]
          urls = [u for u in re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read()) if u.startswith(site + "/")]
          body = json.dumps({"host": site.split("//")[1], "key": key, "keyLocation": f"{site}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"IndexNow: {len(urls)} URL inviati, risposta {r.status}")
          except urllib.error.HTTPError as e:
              print(f"IndexNow: risposta {e.code} {e.read()[:300]!r}")
          PY
