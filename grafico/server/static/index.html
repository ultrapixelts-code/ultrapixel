<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UltraPixel – Studio etichette AI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F4F0">
<link rel="icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..700;1,6..96,400..700&family=Cinzel:wght@500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){try{if(location.pathname==='/prova'&&!sessionStorage.getItem('up_intro')){document.documentElement.classList.add('pre');setTimeout(function(){document.documentElement.classList.remove('pre')},4000)}}catch(e){}})()</script>
<style>
html.pre,html.pre body{background:#0B0D0F}html.pre body>*{visibility:hidden}
:root{--cer:#F4F4F0;--sheet2:#EAEAE5;--white:#fff;--ink:#101214;--gra:#34383B;--tg:#A7ADB0;--tgt:#686D71;--tgl:#858A8E;--hair:rgba(167,173,176,.5);
--c1:#22B8D6;--c2:#6F5BE8;--c3:#D9438F;--c4:#EBA43A;--spec:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));
--body:"Archivo","Helvetica Neue",Arial,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--gut:clamp(16px,4.4vw,72px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cer);color:var(--ink);font:400 16px/1.5 var(--body)}
body{overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.mi{font:400 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tgt)}

/* guide di stampa: come sul sito */
.guides{position:fixed;inset:0;pointer-events:none;z-index:0}
.guides .v{position:absolute;top:0;bottom:0;left:62%;width:1px;background:var(--hair)}
.guides .h{position:absolute;left:0;right:0;top:50vh;height:1px;background:var(--hair);transition:opacity .6s}
body.chat .guides .h{opacity:0}
.crop{position:fixed;bottom:14px;width:22px;height:22px;border:1px solid var(--tg);pointer-events:none;z-index:1}
.crop.l{left:14px;border-width:0 0 1px 1px}.crop.r{right:14px;border-width:0 1px 1px 0}
.seq{position:fixed;bottom:30px;right:var(--gut);z-index:1;pointer-events:none}
@media(max-width:860px){.guides .v,.guides .h{display:none}.seq,.crop{display:none}}

header{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:22px;padding:12px var(--gut);background:rgba(244,244,240,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:18px;text-decoration:none}
.brand img{height:34px;width:auto;display:block}
.brand .tag{display:flex;flex-direction:column;gap:5px}
.brand .tag b{font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.brand .tag i{display:block;height:1px;background:var(--spec);background-size:200% 100%;animation:sl 3s linear infinite}
.lgs{display:flex;gap:14px;margin-left:auto}.lgs a{font:400 11px var(--mono);letter-spacing:.14em;color:var(--tgt);text-decoration:none;padding-bottom:4px}.lgs a[aria-current]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}
.live{display:flex;align-items:center;gap:8px}
.newc{margin-left:auto;border:1px solid var(--hair);background:none;border-radius:999px;padding:7px 12px;font:400 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tgt);cursor:pointer;display:none}.newc:hover{border-color:var(--ink);color:var(--ink)}body.chat .newc{display:block}body.chat .newc+.lgs{margin-left:0}
.dot{width:7px;height:7px;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));animation:spin 2.4s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes sl{to{background-position:-200% 0}}
@media(max-width:560px){.brand img{height:28px}.brand .tag{display:none}.live .mi{display:none}}

/* rail laterale: le fasi del lavoro dell'AI */
.rail{position:fixed;right:var(--gut);top:50%;transform:translateY(-50%);z-index:3;display:grid;gap:9px;justify-items:end;pointer-events:none}
.rail span{font:400 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tg);transition:color .3s;display:flex;align-items:center;gap:8px}
.rail span.done{color:var(--tgt)}
.rail span.on{color:var(--ink)}
.rail span.on::before{content:"";width:6px;height:6px;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));animation:spin 1.6s linear infinite}
@media(max-width:1180px){.rail{display:none}}

main{position:relative;z-index:2;max-width:1320px;margin:0 auto;padding:0 var(--gut) 220px}
@media(min-width:1181px){main{padding-right:calc(var(--gut) + 150px)}}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,5vw,80px);align-items:center;min-height:calc(100vh - 170px);padding:clamp(28px,5vh,64px) 0 24px}
.hero h1{margin:18px 0 22px;font-weight:700;font-stretch:75%;letter-spacing:-.03em;line-height:.9;font-size:clamp(40px,min(6.4vw,9.5vh),104px);text-transform:uppercase}
.hero h1 span{display:block}
.hero h1 span+span{color:var(--tgl)}
.hero h1 em{font-style:normal;background:var(--spec);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;font-size:clamp(17px,1.5vw,20px);line-height:1.45;color:var(--gra);max-width:600px}
.chips{display:grid;gap:0;margin-top:26px;max-width:620px;border-top:1px solid var(--hair)}
.chip{display:grid;grid-template-columns:34px 1fr 20px;align-items:center;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--hair);background:none;padding:11px 0;cursor:pointer;font-size:15px;color:var(--gra);transition:color .2s,padding .25s}
.chip .n{font:400 10px var(--mono);letter-spacing:.14em;color:var(--tg)}
.chip .a{font:400 13px var(--mono);color:var(--tg);transition:transform .25s,color .2s}
.chip:hover{color:var(--ink);padding-left:6px}.chip:hover .a{color:var(--ink);transform:translateX(3px)}
.notes{margin-top:22px;display:grid;gap:8px;max-width:620px}
.note{font-size:13px;line-height:1.5;color:var(--tgt);margin:0;max-width:760px}
.note a{color:var(--ink)}
.timechip{display:inline-flex;align-items:center;gap:10px}

/* il generatore: l'AI che disegna */
.gen{position:relative;width:100%;max-width:470px;justify-self:center}
.gen-top,.gen-tick{display:flex;justify-content:space-between;gap:10px}
.gen-top{margin-bottom:8px}
.gen svg{display:block;width:100%;height:auto;background:var(--white);border:1px solid var(--hair)}
.gen-ann{list-style:none;margin:10px 0 0;padding:0;min-height:72px;display:grid;gap:4px}
.gen-ann li{font:400 10.5px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gra);display:flex;gap:10px;align-items:center}
.gen-ann li b{font-weight:500;color:var(--ink);min-width:20px}
.gen-ann li i{width:10px;height:10px;flex:none}
.gen-tick{margin-top:6px;border-top:1px solid var(--hair);padding-top:8px}
.gen-tick span{transition:color .3s}.gen-tick span.on{color:var(--ink)}
.gen .die{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;vector-effect:non-scaling-stroke}
.gen .draw .die{animation:draw 1.3s cubic-bezier(.6,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gen .art{opacity:0;transition:opacity .7s}
.gen .fill .art{opacity:1}
.gen .ty{opacity:0;transform:translateY(6px);transition:opacity .6s,transform .6s;transform-box:fill-box}
.gen .type .ty{opacity:1;transform:none}
.gen .mk{opacity:0;transition:opacity .3s}.gen .mk.on{opacity:1}
.gen .scan{opacity:0}
.gen .scanning .scan{animation:scan 1.8s cubic-bezier(.5,0,.5,1) forwards}
@keyframes scan{0%{opacity:0;transform:translateY(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(400px)}}
.gen .out{opacity:0;transition:opacity .5s}
.cursor{display:inline-block;width:7px;height:12px;background:var(--ink);vertical-align:-1px;margin-left:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media(max-width:860px){.hero{grid-template-columns:1fr;min-height:0}.gen{max-width:340px;order:2}.gen-ann{min-height:0}.gen-tick{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* conversazione */
.log{display:flex;flex-direction:column;gap:26px;padding-top:28px}
.who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.msg{max-width:780px;font-size:16.5px;line-height:1.6;white-space:pre-wrap}
.msg.me{align-self:flex-end;max-width:min(620px,90%)}
.msg.me .who{justify-content:flex-end}
.msg.me .tx{background:var(--ink);color:var(--cer);padding:13px 18px;border-radius:18px 18px 4px 18px}
.msg.ai .tx{padding-left:18px;border-left:1px solid transparent;border-image:linear-gradient(180deg,var(--c1),var(--c2),var(--c3),var(--c4)) 1}
.msg .thumbs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.msg .thumbs img{height:56px;border-radius:6px;background:#fff}
.err .tx{color:#9b1c1c}

/* console di lavoro */
.console{background:var(--ink);color:#E9E9E4;border-radius:4px;overflow:hidden;max-width:980px;position:relative}
.console::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--spec);background-size:200% 100%;animation:sl 1.6s linear infinite}
.console .hd{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.console .hd .mi{color:#A7ADB0}
.console .hd .mi b{color:#fff;font-weight:500}
.console .bd{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;padding:16px 18px 18px}
.console ol{list-style:none;margin:0;padding:0;display:grid;gap:7px;align-content:start}
.console li{font:400 12.5px/1.5 var(--mono);color:#7E8488;display:grid;grid-template-columns:52px 16px 1fr;gap:6px}
.console li .s{color:#4FBF8A}
.console li.on{color:#fff}
.console li.on .s{color:transparent;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));-webkit-mask:radial-gradient(circle,#000 3px,transparent 3.5px);mask:radial-gradient(circle,#000 3px,transparent 3.5px);animation:spin 1.4s linear infinite}
.console .cursor{background:#fff}
.console .gen{max-width:260px}
.console .gen svg{border-color:rgba(255,255,255,.12)}
.console .gen-ann,.console .gen-tick,.console .gen-top{display:none}
.console .foot{padding:0 18px 14px}
.console .foot .mi{color:#7E8488}
@media(max-width:700px){.console .bd{grid-template-columns:1fr}.console .bd .gen{display:none}}

/* proposte */
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--white);border:1px solid var(--hair);display:flex;flex-direction:column;position:relative;transition:border-color .25s,transform .25s}
.card:hover{border-color:var(--ink)}
.card .top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--hair)}
.card .top .ai{display:flex;align-items:center;gap:7px}
.card .vw{position:relative;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 20%,#fff 0,#EEECE6 75%);overflow:hidden;cursor:zoom-in}
.card .vw::before,.card .vw::after{content:"";position:absolute;background:var(--hair);pointer-events:none}
.card .vw::before{left:50%;top:0;bottom:0;width:1px}.card .vw::after{top:50%;left:0;right:0;height:1px}
.card .vw img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;padding:12px}
.card .tb{display:flex;border-bottom:1px solid var(--hair)}
.card .tb button{flex:1;background:none;border:0;padding:10px;font:400 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tgt);cursor:pointer}
.card .tb button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}
.card .tb button:disabled{cursor:default;opacity:.75}.card .tb button .dot{display:inline-block;vertical-align:1px}
.card .vw.isfoto{background:#d9d4cd}.card .vw.isfoto::before,.card .vw.isfoto::after{display:none}.card .vw.isfoto img{object-fit:cover;padding:0}
.phw{position:absolute;z-index:2;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);padding:6px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.phw .mi{font-size:9.5px;color:var(--ink)}
.card .phn{position:absolute;z-index:2;left:0;right:0;bottom:0;margin:0;padding:18px 12px 8px;font:400 10px/1.4 var(--mono);letter-spacing:.06em;color:#fff;background:linear-gradient(transparent,rgba(16,18,20,.55));display:none}
.card .vw.isfoto .phn{display:block}
.card .bd{padding:16px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-weight:700;font-stretch:80%;font-size:24px;letter-spacing:-.02em;text-transform:uppercase;line-height:1}
.card p{margin:0;color:var(--gra);font-size:14.5px}
.card .act{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:999px;border:1px solid transparent;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
 background:linear-gradient(var(--ink),var(--ink)) padding-box,linear-gradient(90deg,var(--ink) 0 34%,var(--c1) 40%,var(--c2) 47%,var(--c3) 53%,var(--c4) 60%,var(--ink) 66% 100%) 0 0/300% 100% border-box;color:var(--cer);transition:background-position .7s}
.btn:hover{background-position:0 0,100% 0}
.btn.ghost{background:linear-gradient(var(--white),var(--white)) padding-box,linear-gradient(90deg,var(--ink) 0 34%,var(--c1) 40%,var(--c2) 47%,var(--c3) 53%,var(--c4) 60%,var(--ink) 66% 100%) 0 0/300% 100% border-box;color:var(--ink)}
.btn.ghost:hover{background-position:0 0,100% 0}
.btn:disabled{opacity:.45;cursor:default}

/* barra di scrittura */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:linear-gradient(rgba(244,244,240,0),var(--cer) 34%);padding:28px var(--gut) calc(14px + env(safe-area-inset-bottom))}
.box{position:relative;max-width:1080px;margin:0 auto;border-radius:20px;padding:1px;background:var(--ink)}
.box::before{content:"";position:absolute;inset:-1px;border-radius:21px;background:conic-gradient(from var(--a,0deg),var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));opacity:0;transition:opacity .4s;z-index:0;filter:blur(.3px)}
.box::after{content:"";position:absolute;inset:6px 30px -10px;border-radius:30px;background:conic-gradient(from var(--a,0deg),var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));filter:blur(22px);opacity:0;transition:opacity .4s;z-index:-1}
.box:focus-within::before,.box.busy::before{opacity:1}
.box:focus-within::after{opacity:.22}.box.busy::after{opacity:.4}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.box::before,.box::after{animation:rot 4s linear infinite}.box.busy::before,.box.busy::after{animation-duration:1.6s}
@keyframes rot{to{--a:360deg}}
.inner{position:relative;z-index:1;background:var(--white);border-radius:19px;padding:10px 10px 10px 14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:flex-end}
.box textarea{flex:1;border:0;outline:0;resize:none;min-height:26px;max-height:180px;padding:9px 0;background:transparent;font-size:16px}
.ico{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);background:#fff;display:grid;place-items:center;cursor:pointer;transition:border-color .2s}
.ico:hover{border-color:var(--ink)}
.ico svg{width:20px;height:20px}
.send{background:var(--ink);border-color:var(--ink);color:var(--cer)}
.send:disabled{opacity:.5}
.hint{display:flex;justify-content:space-between;gap:10px;padding:0 6px 0 2px}
.hint .mi{font-size:9.5px;color:var(--tg)}
@media(max-width:560px){.hint{display:none}}
.att{display:flex;gap:8px;flex-wrap:wrap}.att:empty{display:none}
.att figure{margin:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.att img{height:62px;width:62px;object-fit:cover;border-radius:8px;border:1px solid var(--hair);background:#fafafa}
.att label{font-size:11px;display:flex;gap:4px;align-items:center;color:var(--gra)}
.att .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:12px;cursor:pointer}

dialog{border:0;padding:0;max-width:min(980px,96vw);width:100%;background:var(--cer);border-radius:4px}
dialog::before{content:"";display:block;height:2px;background:var(--spec)}
dialog::backdrop{background:rgba(16,18,20,.6);backdrop-filter:blur(3px)}
.dlg{padding:clamp(18px,3vw,32px);display:grid;gap:18px;position:relative}
.dlg h2{margin:0;font-weight:700;font-stretch:78%;font-size:clamp(26px,3vw,36px);letter-spacing:-.02em;text-transform:uppercase;line-height:1}
.zoom{display:grid;grid-template-columns:1fr 1fr;gap:12px}.zoom img{width:100%;max-height:70vh;object-fit:contain;background:#fff;border:1px solid var(--hair)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.form label{display:grid;gap:6px;font:400 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gra)}
.form input,.form textarea{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 0;font:400 16px var(--body);text-transform:none;letter-spacing:0;outline:0;color:var(--ink);border-radius:0}
.form input:focus{border-image:var(--spec) 1}
.form .full{grid-column:1/-1}
.form textarea{border:1px solid var(--hair);padding:10px;min-height:80px}
.close{position:absolute;right:14px;top:10px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--ink)}
@media(max-width:640px){.zoom,.form{grid-template-columns:1fr}.props{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="guides" aria-hidden="true"><i class="v"></i><i class="h"></i></div>
<i class="crop l" aria-hidden="true"></i><i class="crop r" aria-hidden="true"></i>
<span class="seq mi" aria-hidden="true">UP / Studio AI · 001</span>
<header>
  <a class="brand" href="https://ultrapixel.it/"><img src="/static/logo.png" alt="UltraPixel" width="370" height="133"><span class="tag"><b data-t="studio"></b><i></i></span></a>
  <span class="live"><span class="dot"></span><span class="mi" data-t="beta"></span></span>
</header>
<nav class="rail" id="rail" aria-hidden="true"></nav>
<main>
  <section class="hero" id="hero">
    <div>
      <span class="mi">AI / 001 — <span data-t="eyebrow"></span></span>
      <h1><span data-t="h1a"></span><span id="h1b"></span></h1>
      <p class="lead" data-t="lead"></p>
      <div class="chips" id="chips"></div>
      <div class="notes" id="notes"></div>
    </div>
    <div class="gen" id="gen"></div>
  </section>
  <div class="log" id="log" aria-live="polite"></div>
</main>
<div class="bar">
  <form class="box" id="f"><div class="inner">
    <div class="att" id="att"></div>
    <div class="row">
      <label class="ico" title=""><input type="file" id="file" accept="image/*" multiple hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M21 12.5 12.6 21a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/></svg><span hidden data-t="attach"></span></label>
      <textarea id="in" rows="1" maxlength="3000"></textarea>
      <button class="ico send" id="go" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span hidden data-t="sendBtn"></span></button>
    </div>
    <div class="hint"><span class="mi" data-t="hintL"></span><span class="mi r">Enter ↵ · Shift+Enter ⏎</span></div>
  </div></form>
</div>
<dialog id="zoom"><div class="dlg"><button class="close" data-close aria-label="×">×</button><span class="mi" id="zk"></span><h2 id="zt"></h2><div class="zoom"><img id="z1" alt=""><img id="z2" alt=""></div></div></dialog>
<dialog id="pick"><div class="dlg"><button class="close" data-close aria-label="×">×</button>
  <span class="mi" data-t="pickEyebrow"></span><h2 id="pt"></h2><p class="note" data-t="pickNote" style="margin:0"></p>
